<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="32" fill="#4a3a20"/>
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7a6030"/>
      <stop offset="100%" stop-color="#2a1a08"/>
    </radialGradient>
  </defs>
  <!-- Honeycomb hex -->
  <polygon points="96,30 126,48 126,84 96,102 66,84 66,48" fill="#f5c518" opacity="0.9"/>
  <polygon points="96,42 116,54 116,78 96,90 76,78 76,54" fill="#e8a800"/>
  <!-- Bee body -->
  <ellipse cx="96" cy="120" rx="22" ry="16" fill="#f5c518"/>
  <rect x="74" y="113" width="12" height="5" rx="2" fill="#1a1a1a"/>
  <rect x="74" y="121" width="12" height="5" rx="2" fill="#1a1a1a"/>
  <rect x="74" y="129" width="12" height="5" rx="2" fill="#1a1a1a"/>
  <!-- Wings -->
  <ellipse cx="80" cy="108" rx="14" ry="8" fill="white" opacity="0.7" transform="rotate(-20 80 108)"/>
  <ellipse cx="112" cy="108" rx="14" ry="8" fill="white" opacity="0.7" transform="rotate(20 112 108)"/>
  <!-- Eyes -->
  <circle cx="110" cy="118" r="3" fill="#1a1a1a"/>
  <!-- Stinger -->
  <polygon points="118,124 124,120 118,130" fill="#c8a000"/>
  <!-- Text -->
  <text x="96" y="170" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#f5c518">ПЧЕЛО</text>
  <text x="96" y="186" text-anchor="middle" font-family="serif" font-size="14" fill="#c8a000">ФЕРМА</text>
</svg>
